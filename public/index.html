<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karya Prabandhak</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <p class="eyebrow">PERSONAL WORKSPACE</p>
        <h1>Task Manager<span>.</span></h1>
        <p class="subtitle">A little progress every day.</p>


    <form id="task-form">
        <input id="task-input" type="text"
               placeholder="What needs to get done?" required>
        <button type="submit">Add task +</button>
    </form>

    <div class="summary">
        <span id="task-count">0 tasks</span>
        <span>YOUR DAILY LIST</span>
    </div>

    <ul id="task-list"></ul>
    <p class="footer">Stay focused. Keep building.</p>
</main>

<script src="/script.js"></script>


</body>
</html>
