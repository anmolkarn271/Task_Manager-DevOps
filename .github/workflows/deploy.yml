name: Task Manager CI/CD

on:
  push:
    branch:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-manager-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout source code
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install depandencies
        run: npm ci

      - name: check JavaScript Syntax
        run: npm test

      - name: set up Docker Builder
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager:latest

     - name: Configure SSH
       env:
         EC2_HOST: ${{ secrets.EC2_HOST }}
         EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
       run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        ssh -i ~/.ssh/deploy_key \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          "$EC2_USERNAME@EC2HOST" \
          "DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
        set -eu

        IMAGE="%DOCKERHUB_USERNAME/devops-task-manager:$IMAGE_TAG"
        CONTAINER="task-manager"
        volume="task-manager-data"

        docker pull "$IMAGE"

        docker volume inspect "$VOLUME" >/dev/null

        docker run -d \
        --name task-manager-next \
        --restart unless-stopped \
        -p 127.0.0.1:3001:3000 \
        -v "$VOLUME:/app/data" \
        "$IMAGE"

        HEALTHY=0

         for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker logs task-manager-next || true
            docker rm -f task-manager-next || true
            exit 1
          fi

          echo "New container passed the health check."
          REMOTE

