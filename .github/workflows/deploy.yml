name: Task Manager CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-manager-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test JavaScript syntax
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-manager:latest

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing or empty."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is missing or empty."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          IMAGE="${DOCKERHUB_USERNAME}/devops-task-manager:${IMAGE_TAG}"

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "IMAGE='${IMAGE}' bash -s" <<'REMOTE'

          set -eu

          CONTAINER="task-manager"
          VOLUME="task-manager-data"

          # Save the current image for rollback.
          OLD_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "$CONTAINER" 2>/dev/null || true)

          # Download the new image.
          docker pull "$IMAGE"

          # Ensure application data volume exists.
          docker volume create "$VOLUME" >/dev/null

          # Replace the old application container.
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 3000:3000 \
            -v "$VOLUME:/app/data" \
            "$IMAGE"

          # Check application health.
          HEALTHY=0

          for i in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:3000/api/health >/dev/null; then
              HEALTHY=1
              break
            fi

            sleep 3
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Deployment health check failed."

            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true

            # Attempt to restore the previous image.
            if [ -n "$OLD_IMAGE" ]; then
              echo "Attempting rollback to $OLD_IMAGE"

              docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p 3000:3000 \
                -v "$VOLUME:/app/data" \
                "$OLD_IMAGE"
            fi

            exit 1
          fi

          echo "Deployment successful!"
          echo "Application health check passed."

          REMOTE
